<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snippet Studio — HTML/CSS 라이브 프리뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-base:#14171f;
    --bg-panel:#1c212b;
    --bg-editor:#10141b;
    --border:#2a303c;
    --border-soft:#232936;
    --text-primary:#eceff4;
    --text-muted:#838b9b;
    --accent:#5b7fff;
    --accent-soft:rgba(91,127,255,.14);
    --warm:#f2a93c;
    --radius:7px;
    --font-ui: 'Space Grotesk', system-ui, sans-serif;
    --font-code: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg-base);
    color:var(--text-primary);
    font-family:var(--font-ui);
    display:flex;
    flex-direction:column;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
    background:var(--bg-panel);
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-right:auto;
  }
  .brand h1{
    font-size:17px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
  }
  .brand span{
    color:var(--text-muted);
    font-size:12.5px;
  }
  .actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .filename-input{
    background:var(--bg-editor);
    border:1px solid var(--border);
    color:var(--text-primary);
    font-family:var(--font-code);
    font-size:12.5px;
    padding:8px 10px;
    border-radius:var(--radius);
    width:150px;
  }
  .filename-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  button{
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:500;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-primary);
    padding:8px 14px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  button:hover{ border-color:var(--accent); }
  button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#0d1118;
    font-weight:600;
  }
  .btn-primary:hover{ background:#7091ff; }

  /* ---------- Tabs (mobile switcher) ---------- */
  .tabs{
    display:none;
    gap:4px;
    padding:10px 20px 0;
    background:var(--bg-base);
  }
  .tabs button{
    flex:1;
    padding:9px 0;
    font-size:12.5px;
    color:var(--text-muted);
    border-color:var(--border-soft);
  }
  .tabs button.active{
    color:var(--text-primary);
    border-color:var(--accent);
    background:var(--accent-soft);
  }

  /* ---------- Workspace ---------- */
  .workspace{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr 1.2fr;
    gap:1px;
    background:var(--border);
    overflow:hidden;
  }
  .panel{
    background:var(--bg-panel);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    border-bottom:1px solid var(--border-soft);
    font-family:var(--font-code);
    font-size:12px;
    color:var(--text-muted);
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--warm);
    display:inline-block;
    margin-right:6px;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .dot{ animation:none; } }
  @keyframes pulse{
    0%,100%{ opacity:.45; }
    50%{ opacity:1; }
  }

  textarea{
    flex:1;
    resize:none;
    border:none;
    background:var(--bg-editor);
    color:var(--text-primary);
    font-family:var(--font-code);
    font-size:13px;
    line-height:1.6;
    padding:14px;
    tab-size:2;
  }
  textarea:focus{ outline:none; box-shadow:inset 0 0 0 1px var(--accent); }

  .panel-preview iframe{
    flex:1;
    border:none;
    background:#fff;
  }

  /* ---------- Responsive: stack + tabs below ~900px ---------- */
  @media (max-width: 900px){
    .tabs{ display:flex; }
    .workspace{
      grid-template-columns:1fr;
      grid-template-rows:1fr;
    }
    .panel{ display:none; }
    .panel.active{ display:flex; }
  }

  footer{
    padding:8px 20px;
    font-size:11.5px;
    color:var(--text-muted);
    border-top:1px solid var(--border);
    background:var(--bg-panel);
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <h1>Snippet Studio</h1>
      <span>코드를 쓰면, 그대로 보여줍니다</span>
    </div>
    <div class="actions">
      <button id="load-example" type="button">예제 불러오기</button>
      <input id="filename" class="filename-input" type="text" value="my-page.html" aria-label="다운로드 파일명" />
      <button id="download" class="btn-primary" type="button">다운로드 ⭳</button>
    </div>
  </header>

  <nav class="tabs" aria-label="편집 패널 전환">
    <button type="button" data-target="html" class="active">HTML</button>
    <button type="button" data-target="css">CSS</button>
    <button type="button" data-target="preview">미리보기</button>
  </nav>

  <main class="workspace">
    <section class="panel panel-html active" data-panel="html">
      <div class="panel-head"><span>HTML</span></div>
      <textarea id="html-input" spellcheck="false" aria-label="HTML 코드 입력"></textarea>
    </section>

    <section class="panel panel-css" data-panel="css">
      <div class="panel-head"><span>CSS</span></div>
      <textarea id="css-input" spellcheck="false" aria-label="CSS 코드 입력"></textarea>
    </section>

    <section class="panel panel-preview" data-panel="preview">
      <div class="panel-head"><span><span class="dot"></span>실시간 미리보기</span></div>
      <iframe id="preview" title="미리보기" sandbox="allow-scripts"></iframe>
    </section>
  </main>

  <footer>입력하는 즉시 오른쪽 미리보기에 반영돼요. 완성되면 다운로드 버튼으로 하나의 HTML 파일로 저장할 수 있어요.</footer>

<script>
  const htmlInput = document.getElementById('html-input');
  const cssInput = document.getElementById('css-input');
  const preview = document.getElementById('preview');
  const filenameInput = document.getElementById('filename');

  const EXAMPLE_HTML = `<main class="card">
  <h1>안녕하세요 👋</h1>
  <p>왼쪽에서 HTML을, 가운데에서 CSS를 수정해보세요.</p>
  <button class="btn">버튼 예시</button>
</main>`;

  const EXAMPLE_CSS = `body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f1ea;
  font-family:system-ui, sans-serif;
}
.card{
  background:#fff;
  padding:32px 36px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  max-width:360px;
  text-align:center;
}
h1{ margin:0 0 8px; font-size:22px; }
p{ color:#555; line-height:1.5; }
.btn{
  margin-top:16px;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:#d97757;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}`;

  function buildDocument(){
    const html = htmlInput.value;
    const css = cssInput.value;
    return `<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Page</title>
<style>
${css}
</style>
</head>
<body>
${html}
</body>
</html>`;
  }

  let debounceTimer;
  function scheduleUpdate(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updatePreview, 200);
  }

  function updatePreview(){
    preview.srcdoc = buildDocument();
  }

  htmlInput.addEventListener('input', scheduleUpdate);
  cssInput.addEventListener('input', scheduleUpdate);

  document.getElementById('load-example').addEventListener('click', () => {
    htmlInput.value = EXAMPLE_HTML;
    cssInput.value = EXAMPLE_CSS;
    updatePreview();
  });

  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([buildDocument()], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    let name = filenameInput.value.trim() || 'my-page.html';
    if(!name.toLowerCase().endsWith('.html')) name += '.html';
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  /* ---------- mobile tab switching ---------- */
  const tabButtons = document.querySelectorAll('.tabs button');
  const panels = document.querySelectorAll('.panel');
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.target;
      panels.forEach(p => {
        p.classList.toggle('active', p.dataset.panel === target);
      });
    });
  });

  /* ---------- init ---------- */
  htmlInput.value = EXAMPLE_HTML;
  cssInput.value = EXAMPLE_CSS;
  updatePreview();
</script>

</body>
</html>
