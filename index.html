<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>REMAIN Studio — HTML/CSS 라이브 프리뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#E7DCC7;
    --bg-base:#EAE0CD;
    --bg-panel:#DED2B8;
    --bg-editor:#F8F3E7;
    --border:#BEAE87;
    --border-soft:#CFC1A0;
    --text-primary:#232A45;
    --text-muted:#6B6E62;
    --accent:#232A45;
    --accent-strong:#171C30;
    --accent-contrast:#F4EEDD;
    --accent-warm:#A9865A;
    --shadow:0 10px 28px rgba(35,42,69,.14);
    --radius-lg:14px;
    --radius:8px;
    --font-ui:'Space Grotesk', system-ui, sans-serif;
    --font-code:'JetBrains Mono','SFMono-Regular', Consolas, monospace;
  }

  [data-theme="dark"]{
    --bg-page:#12162A;
    --bg-base:#171C33;
    --bg-panel:#1F2540;
    --bg-editor:#10131F;
    --border:#3A4266;
    --border-soft:#2A3050;
    --text-primary:#ECE4D3;
    --text-muted:#9298B5;
    --accent:#DED2B8;
    --accent-strong:#EAE0CD;
    --accent-contrast:#171C33;
    --accent-warm:#D8B788;
    --shadow:0 10px 28px rgba(0,0,0,.4);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:var(--font-ui);
    display:flex;
    flex-direction:column;
    height:100dvh;
    padding:18px;
    gap:14px;
    transition:background .2s ease, color .2s ease;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:13px 18px;
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    background:var(--bg-base);
    box-shadow:var(--shadow);
    flex-wrap:wrap;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    margin-right:auto;
  }
  .logo{
    width:30px; height:30px;
    border-radius:8px;
    background:var(--accent);
    color:var(--accent-contrast);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .logo svg{ width:16px; height:16px; }
  .brand-text h1{
    font-size:16.5px;
    font-weight:600;
    margin:0;
    letter-spacing:-.01em;
    line-height:1.2;
  }
  .brand-text span{
    color:var(--text-muted);
    font-size:12px;
  }
  .actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .icon-btn{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--bg-panel);
    color:var(--text-primary);
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover{ border-color:var(--accent); }
  .icon-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .icon-sun{ display:none; }
  [data-theme="dark"] .icon-sun{ display:block; }
  [data-theme="dark"] .icon-moon{ display:none; }

  .ghost-btn{
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:500;
    border:none;
    background:none;
    color:var(--text-muted);
    padding:8px 4px;
    cursor:pointer;
    border-bottom:1.5px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  .ghost-btn:hover{ color:var(--text-primary); border-color:var(--accent-warm); }
  .ghost-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .filename-input{
    background:var(--bg-editor);
    border:1px solid var(--border);
    color:var(--text-primary);
    font-family:var(--font-code);
    font-size:12.5px;
    padding:9px 10px;
    border-radius:var(--radius);
    width:148px;
  }
  .filename-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .btn-primary{
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:600;
    border-radius:var(--radius);
    border:1px solid var(--accent);
    background:var(--accent);
    color:var(--accent-contrast);
    padding:9px 16px;
    cursor:pointer;
    min-height:38px;
    transition:background .15s ease;
  }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-primary:focus-visible{ outline:2px solid var(--accent-warm); outline-offset:2px; }

  /* ---------- Workspace ---------- */
  .workspace{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1.2fr;
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    overflow:hidden;
    min-height:0;
  }
  .panel{
    background:var(--bg-base);
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:0 14px;
    border-bottom:1px solid var(--border-soft);
    flex-wrap:wrap;
  }
  .tab-group{
    display:flex;
    gap:20px;
  }
  .tab-group button{
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    padding:12px 1px;
    font-family:var(--font-ui);
    font-size:13px;
    font-weight:500;
    color:var(--text-muted);
    cursor:pointer;
  }
  .tab-group button.active{
    color:var(--text-primary);
    border-bottom-color:var(--accent-warm);
  }
  .tab-group button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .preview-label{
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-code);
    font-size:12px;
    color:var(--text-muted);
    padding:12px 0;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent-warm);
    display:inline-block;
    animation:pulse 2.2s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .dot{ animation:none; } }
  @keyframes pulse{
    0%,100%{ opacity:.4; }
    50%{ opacity:1; }
  }

  .newtab-btn{
    display:flex; align-items:center; gap:6px;
    background:none; border:none;
    font-family:var(--font-ui);
    font-size:12.5px;
    font-weight:500;
    color:var(--text-muted);
    padding:8px 2px;
    cursor:pointer;
    border-bottom:1.5px solid transparent;
  }
  .newtab-btn:hover{ color:var(--text-primary); border-color:var(--accent-warm); }
  .newtab-btn svg{ width:13px; height:13px; }
  .newtab-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .editor-body{ position:relative; flex:1; min-height:0; }
  textarea{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    resize:none;
    border:none;
    background:var(--bg-editor);
    color:var(--text-primary);
    font-family:var(--font-code);
    font-size:13px;
    line-height:1.6;
    padding:16px 18px;
    tab-size:2;
  }
  textarea.hidden{ display:none; }
  textarea:focus{ outline:none; box-shadow:inset 0 0 0 1px var(--accent-warm); }

  .panel-preview iframe{
    flex:1;
    border:none;
    min-height:0;
    background:#fff;
  }

  footer{
    font-size:11.5px;
    color:var(--text-muted);
    text-align:center;
    flex-shrink:0;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px){
    body{ padding:12px; gap:10px; }
    .workspace{
      grid-template-columns:1fr;
      grid-template-rows:1fr 1fr;
    }
    .brand{ width:100%; margin-right:0; }
    .actions{ width:100%; }
    .filename-input{ flex:1; min-width:100px; }
    .icon-btn{ width:40px; height:40px; }
  }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.5 6.5L3.5 12L8.5 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15.5 6.5L20.5 12L15.5 17.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>REMAIN Studio</h1>
        <span>코드를 쓰면, 그대로 보여줍니다</span>
      </div>
    </div>
    <div class="actions">
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="화면 모드 전환">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2.5V4.5M12 19.5V21.5M4.5 12H2.5M21.5 12H19.5M5.6 5.6L4.9 4.9M19.1 19.1L18.4 18.4M18.4 5.6L19.1 4.9M4.9 19.1L5.6 18.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
      <button id="load-example" class="ghost-btn" type="button">예제 불러오기</button>
      <input id="filename" class="filename-input" type="text" value="my-page.html" aria-label="다운로드 파일명" />
      <button id="download" class="btn-primary" type="button">다운로드 ⭳</button>
    </div>
  </header>

  <main class="workspace">
    <section class="panel panel-editor">
      <div class="panel-head">
        <div class="tab-group" role="group" aria-label="언어 선택">
          <button type="button" data-lang="html" class="active">HTML</button>
          <button type="button" data-lang="css">CSS</button>
        </div>
      </div>
      <div class="editor-body">
        <textarea id="html-input" spellcheck="false" aria-label="HTML 코드 입력"></textarea>
        <textarea id="css-input" class="hidden" spellcheck="false" aria-label="CSS 코드 입력"></textarea>
      </div>
    </section>

    <section class="panel panel-preview">
      <div class="panel-head">
        <span class="preview-label"><span class="dot" aria-hidden="true"></span>실시간 미리보기</span>
        <button id="open-newtab" class="newtab-btn" type="button">
          새 탭에서 열기
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M9 6H6.5A1.5 1.5 0 0 0 5 7.5v10A1.5 1.5 0 0 0 6.5 19h10a1.5 1.5 0 0 0 1.5-1.5V15M13 5h6v6M19 5l-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <iframe id="preview" title="미리보기" sandbox="allow-scripts"></iframe>
    </section>
  </main>

  <footer>모바일에서는 <strong>새 탭에서 열기</strong>로 실제 화면 크기에서 확인하는 걸 추천해요. 화면 모드는 이 도구에만 적용되고, 미리보기와 다운로드 파일에는 영향을 주지 않아요.</footer>

<script>
  const htmlInput = document.getElementById('html-input');
  const cssInput = document.getElementById('css-input');
  const preview = document.getElementById('preview');
  const filenameInput = document.getElementById('filename');

  const EXAMPLE_HTML = `<main class="card">
  <h1>안녕하세요 👋</h1>
  <p>편집 탭에서 HTML과 CSS를 전환하며 수정해보세요.</p>
  <button class="btn">버튼 예시</button>
</main>`;

  const EXAMPLE_CSS = `body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:system-ui, sans-serif;
  background:#f4f1ea;
}
.card{
  background:#fff;
  padding:32px 36px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  max-width:360px;
  text-align:center;
}
h1{ margin:0 0 8px; font-size:22px; }
p{ color:#555; line-height:1.5; }
.btn{
  margin-top:16px;
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:#232a45;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}`;

  function buildDocument(){
    const html = htmlInput.value;
    const css = cssInput.value;
    return `<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Page</title>
<style>
${css}
</style>
</head>
<body>
${html}
</body>
</html>`;
  }

  let debounceTimer;
  function scheduleUpdate(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updatePreview, 200);
  }

  function updatePreview(){
    preview.srcdoc = buildDocument();
  }

  htmlInput.addEventListener('input', scheduleUpdate);
  cssInput.addEventListener('input', scheduleUpdate);

  document.getElementById('load-example').addEventListener('click', () => {
    htmlInput.value = EXAMPLE_HTML;
    cssInput.value = EXAMPLE_CSS;
    updatePreview();
  });

  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([buildDocument()], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    let name = filenameInput.value.trim() || 'my-page.html';
    if(!name.toLowerCase().endsWith('.html')) name += '.html';
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  /* 모바일 등에서 실제 크기로 확인할 수 있도록 새 탭으로 미리보기 열기 */
  document.getElementById('open-newtab').addEventListener('click', () => {
    const blob = new Blob([buildDocument()], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });

  /* ---------- HTML / CSS 편집 전환 ---------- */
  const langButtons = document.querySelectorAll('.tab-group button[data-lang]');
  langButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      langButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const lang = btn.dataset.lang;
      htmlInput.classList.toggle('hidden', lang !== 'html');
      cssInput.classList.toggle('hidden', lang !== 'css');
      (lang === 'html' ? htmlInput : cssInput).focus();
    });
  });

  /* ---------- 화면 모드(라이트/다크) 전환: 도구 자체 UI에만 적용 ---------- */
  const root = document.documentElement;
  const themeToggle = document.getElementById('theme-toggle');

  function applyTheme(theme){
    root.setAttribute('data-theme', theme);
    themeToggle.setAttribute('aria-pressed', String(theme === 'dark'));
  }

  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');

  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
  });

  /* ---------- init ---------- */
  htmlInput.value = EXAMPLE_HTML;
  cssInput.value = EXAMPLE_CSS;
  updatePreview();
</script>

</body>
</html>
